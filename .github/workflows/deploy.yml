name: Python checks

on:
  push:
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile \
            main.py \
            streamlit_app.py \
            database.py \
            config.py \
            model_manager.py \
            utils/hf_model_loader.py \
            brain/inference.py \
            breast/inference.py \
            chest/inference.py \
            kidney/inference.py \
            bone/inference.py

      - name: Verify imports
        run: |
          python - <<'PY'
          import brain.inference
          import breast.inference
          import chest.inference
          import kidney.inference
          import bone.inference
          import config
          import database
          import main
          import model_manager
          import utils.hf_model_loader
          print("All imports succeeded.")
          PY

      - name: Run tests if present
        run: |
          if [ -d tests ] || find . -maxdepth 1 \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            python -m pytest
          else
            echo "No tests found; skipping pytest."
          fi

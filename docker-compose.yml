version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: mediscan-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mediscan
      POSTGRES_USER: mediscan
      POSTGRES_PASSWORD: mediscan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mediscan-backend
    ports:
      - "8000:8000"
    volumes:
      - ./*.pth:/app/ # Mounting local .pth files for easier updating if needed
    depends_on:
      - postgres
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+psycopg2://mediscan:mediscan@postgres:5432/mediscan
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mediscan-frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000
      - PYTHONUNBUFFERED=1
    restart: always

volumes:
  postgres_data:

version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: mediscan-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mediscan
      POSTGRES_USER: mediscan
      POSTGRES_PASSWORD: mediscan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: mediscan-prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mediscan-backend
    ports:
      - "8000:8000"
    volumes:
      - ./*.pth:/app/ # Mounting local .pth files for easier updating if needed
    depends_on:
      - postgres
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+psycopg2://mediscan:mediscan@postgres:5432/mediscan
    restart: always

  grafana:
    image: grafana/grafana:11.3.1
    container_name: mediscan-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mediscan-frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000
      - PYTHONUNBUFFERED=1
    restart: always

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

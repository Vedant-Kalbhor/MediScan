services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/mediscan.db
      MODEL_CACHE_DIR: /tmp/models
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8000
      PORT: 8501
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  backend_data:
